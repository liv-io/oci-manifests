apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prometheus

resources:
  - pvc.yaml
  - service.yaml
  - deployment.yaml
  - ingress.yaml

images:
  - name: quay.io/prometheus/prometheus
    newTag: v3.15.1

configMapGenerator:
  - name: config
    files:
      - config/prometheus.yaml
      - config/rules.yaml

generatorOptions:
  disableNameSuffixHash: true
