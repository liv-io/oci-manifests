apiVersion: apps/v1
kind: Deployment

metadata:
  name: tink

spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tink
  template:
    metadata:
      labels:
        app: tink
    spec:
      containers:
      - name: tink
        image: tink # CHANGEME
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsGroup: 10000
          runAsUser: 10000
      imagePullSecrets:
      - name: registry # CHANGEME
