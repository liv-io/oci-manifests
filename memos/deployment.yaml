apiVersion: apps/v1
kind: Deployment

metadata:
  name: memos

spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: memos
  template:
    metadata:
      labels:
        app: memos
    spec:
      containers:
      - name: memos
        image: memos # CHANGEMe
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8081
          protocol: TCP
        env:
        - name: PORT
          value: '8081'
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsGroup: 10000
          runAsUser: 10000
        volumeMounts:
        - name: db
          mountPath: /var/local/memos/db
      imagePullSecrets:
      - name: registry # CHANGEME
      volumes:
      - name: db
        persistentVolumeClaim:
          claimName: db
