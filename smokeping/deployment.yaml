apiVersion: apps/v1
kind: Deployment

metadata:
  name: smokeping

spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: smokeping
  template:
    metadata:
      labels:
        app: smokeping
    spec:
      containers:
      - name: smokeping
        image: quay.io/superq/smokeping-prober
        imagePullPolicy: IfNotPresent
        args:
          - "--config.file=/etc/smokeping/smokeping.yaml"
          - "--privileged"
        ports:
        - name: http
          containerPort: 9374
          protocol: TCP
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - NET_RAW
          privileged: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsGroup: 65534
          runAsUser: 65534
        volumeMounts:
        - name: config
          mountPath: /etc/smokeping
      volumes:
      - name: config
        configMap:
          name: config
