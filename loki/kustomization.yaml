apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: loki

resources:
  - pvc.yaml
  - service.yaml
  - deployment.yaml
  - ingress.yaml

images:
  - name: grafana/loki
    newTag: 3.7.8

configMapGenerator:
  - name: config
    files:
      - config/loki.yaml

generatorOptions:
  disableNameSuffixHash: true
