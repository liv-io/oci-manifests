apiVersion: apps/v1
kind: Deployment

metadata:
  name: loki

spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      containers:
      - name: loki
        image: grafana/loki
        imagePullPolicy: IfNotPresent
        args:
          - "--config.file=/etc/loki/loki.yaml"
        ports:
        - name: http
          containerPort: 3100
          protocol: TCP
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsGroup: 65534
          runAsUser: 65534
        volumeMounts:
        - name: config
          mountPath: /etc/loki
        - name: storage
          mountPath: /loki
      volumes:
      - name: config
        configMap:
          name: config
      - name: storage
        persistentVolumeClaim:
          claimName: storage
