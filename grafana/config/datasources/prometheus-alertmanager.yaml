apiVersion: 1

datasources:
  - name: Alertmanager
    type: prometheus-alertmanager
    uid: prometheus-alertmanager
    url: http://alertmanager.alertmanager.svc.cluster.local:9093
    access: proxy
    isDefault: false
    editable: false
    jsonData:
      severity_critical: "critical"
      severity_high: "high"
      severity_warning: "warning"
      severity_info: "info"
