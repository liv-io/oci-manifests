apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: alertmanager

resources:
  - service.yaml
  - deployment.yaml
  - ingress.yaml

images:
  - name: quay.io/prometheus/alertmanager
    newTag: v0.34.1

configMapGenerator:
  - name: config
    files:
      - config/alertmanager.yaml

generatorOptions:
  disableNameSuffixHash: true
