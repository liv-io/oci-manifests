apiVersion: v1
kind: Service

metadata:
  name: alloy

spec:
  type: LoadBalancer
  ports:
  - name: http
    port: 12345
    targetPort: 12345
    protocol: TCP
  - name: syslog-tcp
    port: 514
    targetPort: 1514
    protocol: TCP
  - name: syslog-udp
    port: 514
    targetPort: 1514
    protocol: UDP
  selector:
    app: alloy
