apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: alloy

resources:
  - pvc.yaml
  - service.yaml
  - deployment.yaml
  - ingress.yaml

images:
  - name: grafana/alloy
    newTag: v1.21.1

configMapGenerator:
  - name: config
    files:
      - config/config.alloy

generatorOptions:
  disableNameSuffixHash: true
