apiVersion: v1
kind: Service

metadata:
  name: coredns

spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  - name: dns-tcp
    port: 1053
    targetPort: 1053
    protocol: TCP
  - name: dns-udp
    port: 1053
    targetPort: 1053
    protocol: UDP
  selector:
    app: coredns
