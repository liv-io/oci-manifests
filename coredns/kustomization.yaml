apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: coredns

resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml

images:
  - name: coredns # CHANGEME
    newTag: 1.14.7-1

configMapGenerator:
  - name: zones
    files:
      - zones/db.example.com. # CHANGEME
      - zones/db.1.1.1.in-addr.arpa. # CHANGEME

generatorOptions:
  disableNameSuffixHash: true
