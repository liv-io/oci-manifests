apiVersion: v1
kind: Service

metadata:
  name: mariadb

spec:
  ports:
  - port: 3306
    targetPort: 3306
    protocol: TCP

---

apiVersion: discovery.k8s.io/v1
kind: EndpointSlice

metadata:
  name: mariadb-1
  labels:
    kubernetes.io/service-name: mariadb

addressType: IPv4
ports:
  - port: 3306
    protocol: TCP
endpoints:
  - addresses:
      - 10.1.14.11
    conditions:
      ready: true
