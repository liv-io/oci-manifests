apiVersion: v1
kind: Service

metadata:
  name: int

spec:
  type: ClusterIP
  ports:
  - name: network
    port: 8333
    targetPort: 8333
    protocol: TCP
  - name: zmqphblock
    port: 5555
    targetPort: 5555
    protocol: TCP
  - name: zmqphtx
    port: 5556
    targetPort: 5556
    protocol: TCP
  selector:
    app: btc

---

apiVersion: v1
kind: Service

metadata:
  name: ext

spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  ports:
  - name: rpc
    port: 8332
    targetPort: 8332
    protocol: TCP
  - name: zmqprblock
    port: 5557
    targetPort: 5557
    protocol: TCP
  - name: zmqprtx
    port: 5558
    targetPort: 5558
    protocol: TCP
  selector:
    app: btc
