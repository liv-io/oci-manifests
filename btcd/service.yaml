apiVersion: v1
kind: Service

metadata:
  name: int

spec:
  type: ClusterIP
  ports:
  - name: network
    port: 8333
    targetPort: 8333
    protocol: TCP
  selector:
    app: btcd

---

apiVersion: v1
kind: Service

metadata:
  name: ext

spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  ports:
  - name: rpc
    port: 8334
    targetPort: 8334
    protocol: TCP
  selector:
    app: btcd
