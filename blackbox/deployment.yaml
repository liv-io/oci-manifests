apiVersion: apps/v1
kind: Deployment

metadata:
  name: blackbox

spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: blackbox
  template:
    metadata:
      labels:
        app: blackbox
    spec:
      containers:
      - name: blackbox
        image: quay.io/prometheus/blackbox-exporter
        imagePullPolicy: IfNotPresent
        args:
          - "--config.file=/etc/blackbox/blackbox.yaml"
        ports:
        - name: http
          containerPort: 9115
          protocol: TCP
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsGroup: 65534
          runAsUser: 65534
        volumeMounts:
        - name: config
          mountPath: /etc/blackbox
      volumes:
      - name: config
        configMap:
          name: config
