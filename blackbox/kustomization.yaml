apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: blackbox

resources:
  - service.yaml
  - deployment.yaml
  - ingress.yaml

images:
  - name: quay.io/prometheus/blackbox-exporter
    newTag: v0.29.0

configMapGenerator:
  - name: config
    files:
      - config/blackbox.yaml

generatorOptions:
  disableNameSuffixHash: true
